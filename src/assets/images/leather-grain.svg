<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".45 .6" numOctaves="3" seed="23" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="gamma" amplitude="1" exponent="1.5" offset="0"/>
      <feFuncG type="gamma" amplitude="1" exponent="1.5" offset="0"/>
      <feFuncB type="gamma" amplitude="1" exponent="1.5" offset="0"/>
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" filter="url(#grain)" opacity=".8"/>
</svg>
